// Local design state only. No Roblox, network, storage, timers or gameplay code.
function known(state, id) {
  if (!Object.hasOwn(state.enabled, id))
    throw new Error(`Unknown feature: ${id}`);
}

function createState(features) {
  return {
    enabled: Object.fromEntries(features.map((feature) => [feature.id, false])),
    policies: Object.fromEntries(
      features.map((feature) => [
        feature.id,
        feature.policies?.[0] ?? "Recommended",
      ]),
    ),
    choices: Object.fromEntries(
      features.map((feature) => [feature.id, feature.policies ?? []]),
    ),
    exclusiveGroups: Object.fromEntries(
      features
        .filter((feature) => feature.exclusiveGroup)
        .map((feature) => [feature.id, feature.exclusiveGroup]),
    ),
    paused: false,
    stopped: false,
    scenario: "normal",
  };
}

function setEnabled(state, id, on) {
  known(state, id);
  if (typeof on !== "boolean") throw new Error("Switch value must be boolean");
  const enabled = { ...state.enabled, [id]: on };
  const group = state.exclusiveGroups[id];
  if (on && group) {
    for (const [peer, peerGroup] of Object.entries(state.exclusiveGroups)) {
      if (peer !== id && peerGroup === group) enabled[peer] = false;
    }
  }
  return { ...state, enabled };
}

function setPolicy(state, id, value) {
  known(state, id);
  if (!state.choices[id].includes(value))
    throw new Error(`Unknown policy for ${id}`);
  return { ...state, policies: { ...state.policies, [id]: value } };
}

function applyValues(state, values) {
  const selectedGroups = new Set();
  for (const [id, on] of Object.entries(values)) {
    known(state, id);
    if (typeof on !== "boolean")
      throw new Error("Switch value must be boolean");
    const group = state.exclusiveGroups[id];
    if (on && group) {
      if (selectedGroups.has(group))
        throw new Error(`Conflicting owners for ${group}`);
      selectedGroups.add(group);
    }
  }
  return Object.entries(values).reduce(
    (next, [id, on]) => setEnabled(next, id, on),
    state,
  );
}

function pause(state) {
  return { ...state, paused: true };
}
function resume(state) {
  return { ...state, paused: false, stopped: false };
}
function stop(state) {
  return {
    ...state,
    stopped: true,
    paused: false,
    enabled: Object.fromEntries(
      Object.keys(state.enabled).map((id) => [id, false]),
    ),
  };
}

function featureStatus(state, feature) {
  if (!state.enabled[feature.id])
    return { label: "Off", reason: "Choose when this activity is allowed." };
  if (state.stopped)
    return {
      label: "Stopped",
      reason: "Explicit Resume is required after Emergency Stop.",
    };
  if (state.paused)
    return {
      label: "Paused",
      reason: "Your choices are kept. No new work starts.",
    };
  if (state.scenario === "unconfirmed")
    return {
      label: "Waiting",
      reason:
        "Observing a sent action until its 45-second deadline. A skip is not success.",
    };
  if (state.scenario === "nativeJobs" && feature.id === "jobs") {
    return {
      label: "Waiting",
      reason: "Native Auto Jobs owns this activity. The hub yields.",
    };
  }
  if (state.scenario === "lowHealth" && feature.combat) {
    return {
      label: "Waiting",
      reason: "Below your health floor. Other activities can continue.",
    };
  }
  if (
    state.scenario === "closedMarket" &&
    ["marketSell", "marketFlip"].includes(feature.id)
  ) {
    return {
      label: "Waiting",
      reason: "Your Market shop is closed. Renting has its own permission.",
    };
  }
  return {
    label: "Ready",
    reason: "Sample eligibility met. This preview sends no gameplay requests.",
  };
}

    .map(
      (page) =>
        `<button data-page="${page.id}" ${pageId === page.id ? 'aria-current="page"' : ""}><span class="nav-symbol" aria-hidden="true">${escape(page.symbol)}</span>${escape(page.label)}</button>`,
    )
    .join("");
  const page = catalog.pages.find((page) => page.id === pageId);
  document.querySelector("#breadcrumb").textContent = page.label;
  const filtered = catalog.features.filter(
    (feature) => feature.page === pageId && matches(feature),
  );
  const notice =
    pageId === "combat"
      ? `<div class="permission-line"><label><input id="player-permission" type="checkbox" ${permission ? "checked" : ""}>Allow player attacks <span class="muted">· sample permission only</span></label></div>`
      : "";
  const body =
    pageId === "overview" && !query
      ? overview()
      : ["profiles", "settings", "activity"].includes(pageId) && !query
        ? specialPage()
        : `${notice}<div class="feature-list">${filtered.length ? filtered.map(featureCard).join("") : '<div class="empty">No matching feature on this page.</div>'}</div>`;
  content.innerHTML = pageHeading(page) + body;
  document.querySelector("#session-state").textContent = state.stopped
    ? "Stopped · explicit Resume required"
    : state.paused
      ? "Paused · choices kept"
      : `${enabled().length} sample activities selected · 0 gameplay requests`;
}
document.addEventListener("click", (event) => {
  const nav = event.target.closest("[data-page]");
  if (nav) {
    pageId = nav.dataset.page;
    query = "";
    document.querySelector("#search").value = "";
    render();
    content.scrollTop = 0;
    return;
  }
  const command = event.target.closest("[data-command]")?.dataset.command;
  if (command === "sample")
    state = applyValues(state, {
      jobs: true,
      operations: true,
      collect: true,
      properties: true,
      bank: true,
    });
  if (command === "pause") state = pause(state);
  if (command === "resume") state = resume(state);
  if (command === "reset") {
    state = createState(catalog.features);
    permission = false;
    customValues = {};
  }
  if (command) {
    log(`Preview: ${command}`);
    render();
  }
});
document.addEventListener("change", (event) => {
  const target = event.target;
  if (target.dataset.enable) {
    state = setEnabled(state, target.dataset.enable, target.checked);
    log(
      `${target.checked ? "Selected" : "Cleared"}: ${target.getAttribute("aria-label")}`,
    );
    render();
  }
  if (target.dataset.policy) {
    state = setPolicy(state, target.dataset.policy, target.value);
    log(`Policy: ${target.value}`);
    render();
  }
  if (target.dataset.custom) customValues[target.dataset.custom] = target.value;
  if (target.id === "scenario") {
    state = { ...state, scenario: target.value };
    render();
  }
  if (target.id === "player-permission") {
    permission = target.checked;
    render();
  }
});
document.querySelector("#search").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  if (query) {
    const found = catalog.features.find(matches);
    if (found) pageId = found.page;
  }
  render();
});
function emergencyStop() {
  state = stop(state);
  permission = false;
  log("Emergency Stop · sample switches cleared");
  render();
}
document.querySelector("#stop").addEventListener("click", emergencyStop);
document.addEventListener("keydown", (event) => {
  if (event.key === "F8") {
    event.preventDefault();
    emergencyStop();
  }
});
render();

}
</script>
</body>
</html>
