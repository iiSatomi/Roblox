<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Idle Mafia · local UI preview</title>
    <style>:root {
  color-scheme: dark;
  --bg: #171b22;
  --rail: #12161c;
  --panel: #202630;
  --panel2: #252d38;
  --border: #343e4c;
  --text: #eceff4;
  --muted: #b4becc;
  --faint: #8b98ab;
  --accent: #d7a66a;
  --green: #a2c5ad;
  --amber: #e5bf7d;
  --red: #edb1ad;
  font:
    14px/1.5 "Segoe UI",
    system-ui,
    sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
button,
input,
select {
  font: inherit;
}
button,
input,
select,
summary {
  outline-offset: 4px;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.6;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--accent);
}
.preview-note {
  height: 39px;
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid #4a4033;
  background: #25221e;
  color: #ded3c4;
  font-size: 12px;
}
.preview-note strong {
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.shell {
  display: grid;
  grid-template-columns: 224px 1fr;
  height: calc(100dvh - 39px);
  min-height: 460px;
}
.sidebar {
  background: var(--rail);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 27px 14px 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  font-weight: 600;
  padding: 0 12px 24px;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 35px;
  height: 35px;
  border: 1px solid #88704e;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  border-radius: 5px;
}
.brand small {
  display: block;
  font-size: 9px;
  letter-spacing: 0.18em;
  font-weight: 500;
  color: var(--faint);
  margin-top: 1px;
}
.search {
  display: block;
  padding: 0 6px 16px;
}
.search input {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
}
.search input::placeholder {
  color: var(--faint);
}
nav {
  overflow: auto;
  min-height: 0;
  scrollbar-width: thin;
}
nav button {
  display: flex;
  width: 100%;
  gap: 10px;
  align-items: center;
  text-align: left;
  border: 0;
  border-left: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  padding: 9px 12px;
  font-size: 12px;
  border-radius: 3px;
  margin: 1px 0;
}
nav button:hover {
  background: #1e252e;
}
nav button[aria-current="page"] {
  background: #292a29;
  border-left-color: var(--accent);
  color: #f1d2a6;
}
nav .nav-symbol {
  width: 18px;
  text-align: center;
  font-size: 13px;
  opacity: 0.85;
}
.sidebar-foot {
  margin-top: auto;
  padding: 17px 12px 0;
  color: var(--muted);
  font-size: 11px;
}
.sidebar-foot span {
  color: var(--faint);
  font-size: 10px;
}
.workspace {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.topbar {
  min-height: 65px;
  padding: 0 30px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  color: var(--muted);
  font-size: 12px;
}
.topbar > div {
  display: flex;
  align-items: center;
  gap: 8px;
}
.local-dot {
  width: 6px;
  height: 6px;
  background: var(--accent);
  border-radius: 50%;
}
.stop {
  margin-left: 18px;
  border: 1px solid #76514f;
  color: #f1bbb4;
  border-radius: 5px;
  background: #2c2224;
  padding: 7px 11px;
  font-size: 11px;
}
kbd {
  font-family: inherit;
  font-size: 10px;
  opacity: 0.65;
  margin-left: 12px;
}
main {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 31px 38px 45px;
  scrollbar-width: thin;
}
.page-head {
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 20px;
}
h1 {
  margin: 0 0 5px;
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.035em;
}
h2 {
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}
h3 {
  font-size: 13px;
  margin: 0;
  font-weight: 600;
}
p {
  margin: 5px 0 0;
}
.muted,
.page-head p {
  color: var(--muted);
  font-size: 12px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 0.13em;
  color: var(--faint);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}
.badge.on,
.badge.Ready {
  color: var(--green);
  border-color: #40574c;
  background: #202d28;
}
.badge.Waiting,
.badge.Paused {
  color: var(--amber);
  border-color: #655537;
  background: #2e2b24;
}
.badge.Stopped {
  color: var(--red);
  border-color: #76514f;
}
.overview-columns {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(240px, 1fr);
  gap: 20px;
}
.session-panel,
.context-panel {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 23px;
  background: var(--panel);
}
.session-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.session-title {
  font-size: 22px;
  margin: 18px 0 6px;
  letter-spacing: -0.02em;
}
.session-help {
  color: var(--muted);
  font-size: 12px;
  max-width: 460px;
}
.button-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 21px;
}
.button {
  border: 1px solid #665641;
  border-radius: 5px;
  background: #3b3329;
  color: #edd3ae;
  padding: 8px 13px;
  font-size: 12px;
}
.button.secondary {
  border-color: var(--border);
  background: transparent;
  color: var(--muted);
}
.context-row {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 11px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.context-row:last-child {
  border-bottom: 0;
}
.context-row span {
  color: var(--faint);
}
.context-row strong {
  text-align: right;
  font-weight: 500;
}
.scenario {
  display: grid;
  gap: 8px;
  margin: 23px 0 24px;
  font-size: 12px;
  color: var(--muted);
}
select,
input[type="number"] {
  border: 1px solid #465264;
  border-radius: 4px;
  background: #171c24;
  color: var(--text);
  padding: 7px 10px;
  font-size: 12px;
  max-width: 100%;
}
.scenario select {
  max-width: 310px;
}
.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin: 26px 0 10px;
}
.section-heading span {
  color: var(--faint);
  font-size: 11px;
}
.activity-list {
  border-top: 1px solid var(--border);
}
.activity-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.activity-row p {
  color: var(--faint);
  font-size: 11px;
}
.text-button {
  color: var(--accent);
  padding: 0;
  border: 0;
  background: none;
  font-size: 11px;
}
.feature-list {
  display: grid;
  gap: 12px;
  max-width: 1000px;
}
.feature {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 18px 21px;
}
.feature-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
}
.feature-description {
  font-size: 12px;
  color: var(--muted);
  max-width: 690px;
  margin-top: 5px;
}
.feature-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 15px;
  flex-wrap: wrap;
}
.feature-actions > label {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  color: var(--faint);
}
.feature-actions select {
  min-width: 165px;
}
.sensitive {
  color: #c4ad90;
  font-size: 10px;
  margin-left: auto;
}
.status-line {
  border-top: 1px solid var(--border);
  padding-top: 11px;
  margin-top: 14px;
  font-size: 11px;
  color: var(--faint);
  display: flex;
  align-items: center;
  gap: 9px;
}
.status-line strong {
  font-weight: 500;
  color: var(--muted);
}
.switch {
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
  padding-top: 2px;
}
.switch input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  margin: 0;
}
.switch-track {
  display: block;
  width: 33px;
  height: 19px;
  border-radius: 12px;
  background: #3c4654;
  border: 1px solid #536071;
  transition: background 0.12s;
}
.switch-track:after {
  content: "";
  display: block;
  width: 13px;
  height: 13px;
  margin: 2px;
  border-radius: 50%;
  background: #b7c0cd;
  transition: transform 0.12s;
}
.switch input:checked + .switch-track {
  background: #80613e;
  border-color: #c59860;
}
.switch input:checked + .switch-track:after {
  transform: translateX(13px);
  background: #f3d2a4;
}
.switch input:focus-visible + .switch-track {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
details {
  margin-top: 14px;
  font-size: 12px;
}
summary {
  cursor: pointer;
  color: var(--muted);
}
.custom-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 15px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 4px;
}
.custom-grid label {
  display: grid;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.limits {
  font-size: 11px;
  color: #c8b798;
  margin-top: 12px;
}
.permission-line {
  background: #29251f;
  border: 1px solid #5b4b36;
  border-radius: 5px;
  padding: 13px 16px;
  margin-bottom: 19px;
  font-size: 12px;
  color: #dbc6a5;
}
.permission-line label {
  display: flex;
  align-items: center;
  gap: 10px;
}
.empty {
  padding: 25px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
}
.info-panel {
  border-left: 2px solid var(--accent);
  padding: 2px 0 2px 15px;
  font-size: 12px;
  color: var(--muted);
  max-width: 850px;
  margin-bottom: 24px;
}
.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 18px 0;
  border-bottom: 1px solid var(--border);
}
.profile-row strong {
  min-width: 145px;
  font-size: 12px;
}
.profile-row span {
  color: var(--muted);
  font-size: 12px;
}
footer {
  min-height: 36px;
  padding: 8px 30px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 20px;
  justify-content: space-between;
  font-size: 10px;
  color: var(--faint);
}
footer span:first-child {
  color: var(--muted);
}
.notice {
  font-size: 11px;
  color: var(--faint);
  margin: 18px 0 0;
}
@media (min-width: 1450px) {
  main {
    padding-left: 48px;
    padding-right: 48px;
  }
  .overview-columns {
    max-width: 1250px;
  }
}
@media (max-width: 980px) {
  .shell {
    grid-template-columns: 190px 1fr;
  }
  .sidebar {
    padding-left: 10px;
    padding-right: 10px;
  }
  main {
    padding: 25px 22px;
  }
  .topbar {
    padding: 0 22px;
  }
  .overview-columns {
    grid-template-columns: 1fr;
  }
  .context-panel {
    padding-top: 16px;
    padding-bottom: 16px;
  }
  .context-panel .context-row {
    padding: 8px 0;
  }
  .sensitive {
    margin-left: 0;
  }
  .stop {
    margin-left: 4px;
  }
}
@media (max-width: 650px) {
  .preview-note {
    height: auto;
    min-height: 47px;
    padding: 8px 14px;
    align-items: flex-start;
    gap: 4px;
    flex-direction: column;
    font-size: 10px;
  }
  .shell {
    height: auto;
    min-height: calc(100dvh - 47px);
    grid-template-columns: 1fr;
  }
  .sidebar {
    padding: 14px;
    display: block;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    padding: 0 0 12px;
    font-size: 16px;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
  }
  .brand small {
    font-size: 8px;
  }
  .search {
    padding: 0 0 10px;
  }
  nav {
    display: flex;
    overflow: auto;
    gap: 4px;
  }
  nav button {
    width: auto;
    flex-shrink: 0;
    padding: 8px;
    font-size: 11px;
  }
  .nav-symbol,
  .sidebar-foot {
    display: none;
  }
  .workspace {
    min-height: calc(100dvh - 228px);
  }
  .topbar {
    padding: 12px 16px;
    min-height: 50px;
  }
  .topbar > div {
    font-size: 10px;
  }
  .stop {
    font-size: 10px;
    padding: 6px 9px;
  }
  kbd {
    display: none;
  }
  main {
    padding: 22px 16px;
    overflow: visible;
  }
  .page-head {
    gap: 10px;
  }
  h1 {
    font-size: 23px;
  }
  .page-head p {
    font-size: 11px;
  }
  .feature {
    padding: 16px;
  }
  .custom-grid {
    grid-template-columns: 1fr;
  }
  footer {
    padding: 9px 16px;
    flex-direction: column;
    gap: 2px;
  }
  .session-panel,
  .context-panel {
    padding: 18px;
  }
  .feature-description {
    font-size: 11px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
</style>

  <body>
    <div class="preview-note">
      <strong>LOCAL DESIGN PREVIEW</strong
      ><span>Simulated data · No Roblox connection · No gameplay requests</span>
    </div>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">IM</span>
          <div>Idle Mafia<small>EMBER RECODE</small></div>
        </div>
        <label class="search"
          ><span class="sr-only">Find a feature</span
          ><input
            id="search"
            type="search"
            placeholder="Find a feature…"
            autocomplete="off"
        /></label>
        <nav id="navigation" aria-label="Hub pages"></nav>
        <div class="sidebar-foot">
          A fresh start.<br /><span>Evidence build 0.26.487.1</span>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span id="breadcrumb">Overview</span>
          <div>
            <span class="local-dot"></span> Local preview
            <button id="stop" class="stop">Emergency stop <kbd>F8</kbd></button>
          </div>
        </header>
        <main id="content" tabindex="-1"><p>Loading the local design…</p></main>
        <footer>
          <span id="session-state">All activities off</span
          ><span>Memory only · Nothing saved to your account</span>
        </footer>
      </div>
    </div>
  <script>
{
// Local design state only. No Roblox, network, storage, timers or gameplay code.
function known(state, id) {
  if (!Object.hasOwn(state.enabled, id))
    throw new Error(`Unknown feature: ${id}`);
}

function createState(features) {
  return {
    enabled: Object.fromEntries(features.map((feature) => [feature.id, false])),
    policies: Object.fromEntries(
      features.map((feature) => [
        feature.id,
        feature.policies?.[0] ?? "Recommended",
      ]),
    ),
    choices: Object.fromEntries(
      features.map((feature) => [feature.id, feature.policies ?? []]),
    ),
    exclusiveGroups: Object.fromEntries(
      features
        .filter((feature) => feature.exclusiveGroup)
        .map((feature) => [feature.id, feature.exclusiveGroup]),
    ),
    paused: false,
    stopped: false,
    scenario: "normal",
  };
}

function setEnabled(state, id, on) {
  known(state, id);
  if (typeof on !== "boolean") throw new Error("Switch value must be boolean");
  const enabled = { ...state.enabled, [id]: on };
  const group = state.exclusiveGroups[id];
  if (on && group) {
    for (const [peer, peerGroup] of Object.entries(state.exclusiveGroups)) {
      if (peer !== id && peerGroup === group) enabled[peer] = false;
    }
  }
  return { ...state, enabled };
}

function setPolicy(state, id, value) {
  known(state, id);
  if (!state.choices[id].includes(value))
    throw new Error(`Unknown policy for ${id}`);
  return { ...state, policies: { ...state.policies, [id]: value } };
}

function applyValues(state, values) {
  const selectedGroups = new Set();
  for (const [id, on] of Object.entries(values)) {
    known(state, id);
    if (typeof on !== "boolean")
      throw new Error("Switch value must be boolean");
    const group = state.exclusiveGroups[id];
    if (on && group) {
      if (selectedGroups.has(group))
        throw new Error(`Conflicting owners for ${group}`);
      selectedGroups.add(group);
    }
  }
  return Object.entries(values).reduce(
    (next, [id, on]) => setEnabled(next, id, on),
    state,
  );
}

function pause(state) {
  return { ...state, paused: true };
}
function resume(state) {
  return { ...state, paused: false, stopped: false };
}
function stop(state) {
  return {
    ...state,
    stopped: true,
    paused: false,
    enabled: Object.fromEntries(
      Object.keys(state.enabled).map((id) => [id, false]),
    ),
  };
}

function featureStatus(state, feature) {
  if (!state.enabled[feature.id])
    return { label: "Off", reason: "Choose when this activity is allowed." };
  if (state.stopped)
    return {
      label: "Stopped",
      reason: "Explicit Resume is required after Emergency Stop.",
    };
  if (state.paused)
    return {
      label: "Paused",
      reason: "Your choices are kept. No new work starts.",
    };
  if (state.scenario === "unconfirmed")
    return {
      label: "Waiting",
      reason:
        "Observing a sent action until its 45-second deadline. A skip is not success.",
    };
  if (state.scenario === "nativeJobs" && feature.id === "jobs") {
    return {
      label: "Waiting",
      reason: "Native Auto Jobs owns this activity. The hub yields.",
    };
  }
  if (state.scenario === "lowHealth" && feature.combat) {
    return {
      label: "Waiting",
      reason: "Below your health floor. Other activities can continue.",
    };
  }
  if (
    state.scenario === "closedMarket" &&
    ["marketSell", "marketFlip"].includes(feature.id)
  ) {
    return {
      label: "Waiting",
      reason: "Your Market shop is closed. Renting has its own permission.",
    };
  }
  return {
    label: "Ready",
    reason: "Sample eligibility met. This preview sends no gameplay requests.",

let state = createState(catalog.features);
let pageId = "overview";
let query = "";
let permission = false;
let customValues = {};
const history = [];
const content = document.querySelector("#content");
const escape = (value) =>
  String(value).replace(
    /[&<>"']/g,
    (char) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
        char
      ],
  );
const enabled = () =>
  catalog.features.filter((feature) => state.enabled[feature.id]);
const matches = (feature) =>
  `${feature.id} ${feature.label} ${feature.description}`
    .toLowerCase()
    .includes(query);
function log(text) {
  history.unshift({ text, time: new Date().toLocaleTimeString() });
  history.splice(40);
}
function switchRow(feature) {
  return `<label class="switch"><input type="checkbox" data-enable="${feature.id}" aria-label="${escape(feature.label)}" ${state.enabled[feature.id] ? "checked" : ""}><span class="switch-track"></span></label>`;
}
function control(field, feature) {
  const value = customValues[`${feature.id}/${field.label}`] ?? field.value;
  if (field.type === "boolean")
    return `<label>${escape(field.label)}<input data-custom="${escape(feature.id + "/" + field.label)}" aria-label="${escape(field.label)}" type="checkbox" ${value === true ? "checked" : ""}></label>`;
  if (field.type === "select")
    return `<label>${escape(field.label)}<select data-custom="${escape(feature.id + "/" + field.label)}" aria-label="${escape(field.label)}">${field.options.map((option) => `<option ${option === value ? "selected" : ""}>${escape(option)}</option>`).join("")}</select></label>`;
  return `<label>${escape(field.label)}<input data-custom="${escape(feature.id + "/" + field.label)}" aria-label="${escape(field.label)}" type="number" min="${field.min ?? 0}" ${field.max ? 'max="' + field.max + '"' : ""} value="${escape(value)}"></label>`;
}
function featureCard(feature) {
  let status = featureStatus(state, feature);
  if (
    ["combat", "warCombat"].includes(feature.id) &&
    state.enabled[feature.id] &&
    !permission &&
    !["Stopped", "Paused"].includes(status.label)
  )
    status = {
      label: "Waiting",
      reason:
        "Allow player attacks separately. A target policy never grants permission.",
    };
  return `<article class="feature" data-feature="${feature.id}"><div class="feature-head"><div><h3>${escape(feature.label)}</h3><p class="feature-description">${escape(feature.description)}</p></div>${switchRow(feature)}</div>
    <div class="feature-actions">${feature.policies.length ? `<label>Goal / policy<select aria-label="${escape(feature.label)} policy" data-policy="${feature.id}">${feature.policies.map((policy) => `<option ${state.policies[feature.id] === policy ? "selected" : ""}>${escape(policy)}</option>`).join("")}</select></label>` : ""}${feature.sensitive ? '<span class="sensitive">Separate permission and limits</span>' : ""}</div>
    ${feature.limits ? `<p class="limits">${escape(feature.limits)}</p>` : ""}
    ${feature.custom.length ? `<details ${state.policies[feature.id] === "Custom" ? "open" : ""}><summary>Custom · ${feature.custom.length} useful overrides</summary><div class="custom-grid">${feature.custom.map((field) => control(field, feature)).join("")}</div><p class="notice">Preview values only. No account configuration is loaded or saved.</p></details>` : ""}
    <div class="status-line"><span class="badge ${status.label}">${status.label}</span><span>${escape(status.reason)}</span></div></article>`;
}
function pageHeading(page) {
  return `<div class="page-head"><div><div class="eyebrow">IDLE MAFIA / EMBER RECODE</div><h1>${escape(page.label)}</h1><p>${escape(page.description)}</p></div><span class="badge">Design preview</span></div>`;
}
function overview() {
  const active = enabled();
  const status = state.stopped
    ? "Stopped"
    : state.paused
      ? "Paused"
      : active.length
        ? "Choices prepared"
        : "All activities off";
  return `<div class="overview-columns"><section class="session-panel"><div class="session-heading"><h2>Your session</h2><span class="badge ${state.stopped ? "Stopped" : state.paused ? "Paused" : ""}">${status}</span></div><div class="session-title">${active.length ? `${active.length} activities selected` : "A clear place to start"}</div><p class="session-help">Turn on what you want and choose a goal. The hub explains the next step; routine details follow native state.</p><div class="button-row"><button class="button" data-command="sample">Load sample choices</button><button class="button secondary" data-command="${state.paused || state.stopped ? "resume" : "pause"}">${state.paused || state.stopped ? "Resume" : "Pause"}</button><button class="button secondary" data-command="reset">Reset preview</button></div><p class="notice">These controls change this preview only. No account is connected.</p></section>
    <section class="context-panel"><h2>Current context <span class="badge">Sample</span></h2><div class="context-row"><span>Cash / bank</span><strong>$4.2M / $18M</strong></div><div class="context-row"><span>Health / stamina</span><strong>${state.scenario === "lowHealth" ? "34%" : "82%"} / 24</strong></div><div class="context-row"><span>Native automation</span><strong>${state.scenario === "nativeJobs" ? "Auto Jobs active" : "None in sample"}</strong></div><div class="context-row"><span>Native evidence build</span><strong>${catalog.evidenceBuild}</strong></div></section></div>
    <label class="scenario">Try a sample situation<select id="scenario" aria-label="Sample situation">${[
      ["normal", "Normal conditions"],
      ["lowHealth", "Low health"],
      ["nativeJobs", "Native Auto Jobs active"],
      ["closedMarket", "Market shop closed"],
      ["unconfirmed", "Sent action still unconfirmed"],
    ]
      .map(
        ([value, label]) =>
          `<option value="${value}" ${state.scenario === value ? "selected" : ""}>${label}</option>`,
      )
      .join("")}</select></label>
    <div class="section-heading"><h2>Your activities</h2><span>One reason per routine</span></div><div class="activity-list">${
      active.length
        ? active
            .map((feature) => {
              const result = featureStatus(state, feature);
              return `<div class="activity-row"><div><h3>${escape(feature.label)}</h3><p>${escape(result.reason)}</p></div><button class="text-button" data-page="${feature.page}">Open settings →</button></div>`;
            })
            .join("")
        : '<div class="empty">Nothing selected. Load the sample choices or open a feature page.</div>'
    }</div>`;
}
function specialPage() {
  if (pageId === "player")
    return `<div class="info-panel">Player dashboard preview · simulated data only. No account, profile, trust score or gameplay connection is loaded.</div>
    <div class="overview-columns"><section class="session-panel"><div class="session-heading"><h2>Your player</h2><span class="badge">Sample</span></div><div class="session-title">Level 128 · Prestige 3</div><div class="context-row"><span>Attack / Defense</span><strong>48,750 / 39,200</strong></div><div class="context-row"><span>Health / Energy / Stamina</span><strong>100 / 50 / 24</strong></div><div class="context-row"><span>Cash / Bank</span><strong>$4.2M / $18M</strong></div></section>
    <section class="context-panel"><h2>Cash flow <span class="badge">Gross estimate</span></h2><div class="context-row"><span>Property + observed mugs</span><strong>$3.6M/hr</strong></div><div class="context-row"><span>Current property income</span><strong>$2.4M/hr</strong></div><div class="context-row"><span>Observed mug payouts</span><strong>$1.2M/hr</strong></div><p class="notice">Example 20-minute observation window. Confirmed own payouts only; includes idle time. Purchases, cash losses and other income are excluded.</p></section></div>
    <div class="feature-list"><section class="info-panel"><h2>Property portfolio</h2><div class="context-row"><span>Owned / active / inactive copies</span><strong>18 / 16 / 2</strong></div><div class="context-row"><span>Before fight modifiers</span><strong>$2M/hr</strong></div><div class="context-row"><span>Native fight-income multiplier</span><strong>1.2×</strong></div><p class="notice">Live per-property rows show owned and active copies with catalog base income. Shared bonuses are not guessed for individual buildings.</p></section><section class="info-panel"><h2>Trust & client-only information</h2><div class="context-row"><span>Trust score</span><strong>Not exposed in inspected client data</strong></div><p class="notice">Replicated fields and native sources are inspected read-only. No score is inferred from bot-check frequency; native challenges remain manual.</p></section></div>`;

  if (pageId === "profiles")
    return `<div class="info-panel">Profile layout preview. No account files are read, imported or overwritten.</div><div class="profile-row"><strong>Active profile</strong><span>Local sample · memory only</span></div><div class="profile-row"><strong>Selected profile</strong><select aria-label="Sample profile"><option>Sample farming choices</option></select><button class="button" data-command="sample">Apply sample choices</button></div><p class="notice">Selecting a real profile will never be the same as activating it. Import changes and permissions will be reviewed first.</p>`;
  if (pageId === "settings")
    return `<div class="info-panel">Keep common preferences here once. Native costs, timers and protocol internals are automatic facts, not dozens of settings.</div><div class="profile-row"><strong>Appearance</strong><span>Slate surfaces · copper accent · motion follows your browser preference</span></div><div class="profile-row"><strong>Shared limits</strong><span>Health, stamina, cash reserves and spending policies will have one authoritative home.</span></div><div class="profile-row"><strong>Technical details</strong><span>Compatibility, state age and request history live in Activity.</span></div>`;
  if (pageId === "activity")
    return `<div class="info-panel">UI changes in this local preview. These are not gameplay actions or confirmed server outcomes.</div><div class="activity-list">${history.length ? history.map((row) => `<div class="activity-row"><span>${escape(row.text)}</span><span class="muted">${escape(row.time)}</span></div>`).join("") : '<div class="empty">No local changes yet.</div>'}</div>`;
  return "";
}
function render() {
  document.querySelector("#navigation").innerHTML = catalog.pages
    .map(
      (page) =>
        `<button data-page="${page.id}" ${pageId === page.id ? 'aria-current="page"' : ""}><span class="nav-symbol" aria-hidden="true">${escape(page.symbol)}</span>${escape(page.label)}</button>`,
    )
    .join("");
  const page = catalog.pages.find((page) => page.id === pageId);
  document.querySelector("#breadcrumb").textContent = page.label;
  const filtered = catalog.features.filter(
    (feature) => feature.page === pageId && matches(feature),
  );
  const notice =
    pageId === "combat"
      ? `<div class="permission-line"><label><input id="player-permission" type="checkbox" ${permission ? "checked" : ""}>Allow player attacks <span class="muted">· sample permission only</span></label></div>`
      : "";
  const body =
    pageId === "overview" && !query
      ? overview()
      : ["player", "profiles", "settings", "activity"].includes(pageId) && !query
        ? specialPage()
        : `${notice}<div class="feature-list">${filtered.length ? filtered.map(featureCard).join("") : '<div class="empty">No matching feature on this page.</div>'}</div>`;
  content.innerHTML = pageHeading(page) + body;
  document.querySelector("#session-state").textContent = state.stopped
    ? "Stopped · explicit Resume required"
    : state.paused
      ? "Paused · choices kept"
      : `${enabled().length} sample activities selected · 0 gameplay requests`;
}
document.addEventListener("click", (event) => {
  const nav = event.target.closest("[data-page]");
  if (nav) {
    pageId = nav.dataset.page;
    query = "";
    document.querySelector("#search").value = "";
    render();
    content.scrollTop = 0;
    return;
  }
  const command = event.target.closest("[data-command]")?.dataset.command;
  if (command === "sample")
    state = applyValues(state, {
      jobs: true,
      operations: true,
      collect: true,
      properties: true,
      bank: true,
    });
  if (command === "pause") state = pause(state);
  if (command === "resume") state = resume(state);
  if (command === "reset") {
    state = createState(catalog.features);
    permission = false;
    customValues = {};
  }
  if (command) {
    log(`Preview: ${command}`);
    render();
  }
});
document.addEventListener("change", (event) => {
  const target = event.target;
  if (target.dataset.enable) {
    state = setEnabled(state, target.dataset.enable, target.checked);
    log(
      `${target.checked ? "Selected" : "Cleared"}: ${target.getAttribute("aria-label")}`,
    );
    render();
  }
  if (target.dataset.policy) {
    state = setPolicy(state, target.dataset.policy, target.value);
    log(`Policy: ${target.value}`);
    render();
  }
  if (target.dataset.custom) customValues[target.dataset.custom] = target.type === "checkbox" ? target.checked : target.value;
  if (target.id === "scenario") {
    state = { ...state, scenario: target.value };
    render();
  }
  if (target.id === "player-permission") {
    permission = target.checked;
    render();
  }
});
document.querySelector("#search").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  if (query) {
    const found = catalog.features.find(matches);
    if (found) pageId = found.page;
  }
  render();
});
function emergencyStop() {
  state = stop(state);
  permission = false;
  log("Emergency Stop · sample switches cleared");
  render();
}
document.querySelector("#stop").addEventListener("click", emergencyStop);
document.addEventListener("keydown", (event) => {
  if (event.key === "F8") {
    event.preventDefault();
    emergencyStop();
  }
});
render();

}
</script>
